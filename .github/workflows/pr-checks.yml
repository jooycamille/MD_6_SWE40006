name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # Quick checks for pull requests
  pr-checks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Frontend build check
      working-directory: ./frontend
      run: npm run build

    - name: Backend syntax check
      working-directory: ./backend
      run: python -m py_compile *.py 2>/dev/null || echo "No Python files found in root"

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test -- --ci --watchAll=false

    - name: Run backend tests
      working-directory: ./backend
      run: python -m pytest --tb=short || echo "No tests found yet"