name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Update npm dependencies
      working-directory: ./frontend
      run: |
        npm update
        npm audit fix --audit-level=moderate || true

    - name: Update Python dependencies
      working-directory: ./backend
      run: |
        pip install --upgrade pip
        pip list --outdated --format=json | jq -r '.[] | "\(.name)==\(.latest_version)"' > requirements-updated.txt || true

    - name: Create Pull Request for dependency updates
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'Automated Dependency Updates'
        body: |
          This PR contains automated dependency updates.
          
          Please review the changes carefully before merging.
          
          - Frontend dependencies updated via `npm update`
          - Backend dependencies checked for updates
          
          Make sure to test the application after merging.
        branch: dependency-updates
        delete-branch: true